<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>辐射剂量监测</title>
<style>
  :root{--bg:#0b0f14;--card:#141b24;--line:#233040;--txt:#e6edf3;--dim:#8b98a5;--ok:#2ea043;--warn:#d29922;--bad:#f85149;--acc:#58a6ff;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);}
  body{color:var(--txt);font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;}
  body.alarm{animation:alarmBg .55s ease-in-out infinite alternate;}
  @keyframes alarmBg{from{background:#0b0f14;}to{background:#521317;}}
  .wrap{height:100vh;height:100dvh;max-width:560px;margin:0 auto;padding:6px;display:flex;flex-direction:column;justify-content:space-between;gap:5px;overflow:hidden;}
  header{display:flex;align-items:center;justify-content:space-between;gap:6px;flex:0 0 auto;}
  header h1{font-size:14px;margin:0;font-weight:600;}
  .dev{font-size:11px;color:var(--dim);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#555;margin-right:5px;vertical-align:1px;}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok);}
  .dot.demo{background:var(--warn);box-shadow:0 0 8px var(--warn);}
  .dot.err{background:var(--bad);box-shadow:0 0 8px var(--bad);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 6px;}
  .toprow{display:flex;gap:5px;flex:0 0 auto;}
  .rate{flex:1.05;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:3px 4px;}
  .rate .label{font-size:10px;color:var(--dim);letter-spacing:1px;}
  .rate .big{font-size:28px;font-weight:700;line-height:1.12;font-variant-numeric:tabular-nums;}
  .rate .big small{font-size:11px;font-weight:500;color:var(--dim);margin-left:3px;}
  .rate .note{font-size:9px;color:var(--dim);min-height:11px;}
  .rate.alarm .big{color:var(--bad);}
  .rate.ok .big{color:var(--ok);}
  .minigrid{flex:1.25;display:grid;grid-template-columns:1fr 1fr;gap:4px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:2px;display:flex;flex-direction:column;justify-content:center;text-align:center;}
  .stat .v{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
  .stat .k{font-size:9px;color:var(--dim);}
  .alarmbar{border-radius:9px;padding:2px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;text-align:center;}
  .alarmbar.ok{background:rgba(46,160,67,.12);color:var(--ok);border:1px solid rgba(46,160,67,.4);}
  .alarmbar.bad{background:rgba(248,81,73,.18);color:#ffc9c6;border:1px solid var(--bad);animation:pulse 1s infinite;}
  @keyframes pulse{50%{opacity:.5;}}
  .chartrow{display:flex;gap:5px;flex:1 1 auto;min-height:150px;max-height:36vh;}
  .chartrow .card{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;}
  .chartrow h2{font-size:10px;color:var(--dim);font-weight:500;margin:0 0 2px 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chartrow canvas{flex:1 1 0;width:100%;min-height:0;display:block;}
  .metrics,.hist{flex:0 0 auto;}
  .hstats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;}
  .hstats+.hstats{margin-top:4px;}
  .hstat{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;padding:2px;text-align:center;}
  .hstat .v{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;}
  .hstat .k{font-size:9px;color:var(--dim);}
  .spnote{font-size:9px;color:var(--dim);margin-top:3px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hlist{margin-top:3px;font-size:10px;max-height:40px;overflow:hidden;}
  .hrow{display:grid;grid-template-columns:1.4fr 1fr .8fr;gap:4px;padding:1px 2px;border-bottom:1px solid rgba(255,255,255,.05);}
  .hrow.al{color:var(--bad);}
  .btnrow{display:flex;gap:5px;flex:0 0 auto;}
  button{flex:1;min-height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:12px;padding:0 4px;cursor:pointer;}
  button.primary{background:var(--acc);border-color:var(--acc);color:#04101d;font-weight:600;}
  button.danger{color:var(--bad);border-color:rgba(248,81,73,.4);}
  button:disabled{opacity:.45;cursor:not-allowed;}
  #log{font-size:10px;color:var(--dim);min-height:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto;}

  /* ===== 电脑宽屏布局（>=900px）：左栏数据，右栏图表 ===== */
  @media (min-width: 900px){
    .wrap{max-width:1400px; padding:10px; display:grid; gap:8px;
          grid-template-columns: 380px 1fr;
          grid-template-rows: auto auto auto auto auto;
          grid-template-areas:
            "header header"
            "top    charts"
            "metrics charts"
            "btns   hist"
            "log    log";
          justify-content:stretch;}
    header{grid-area:header;}
    .toprow{grid-area:top; flex-direction:column;}
    .toprow .rate{flex:0 0 auto; padding:8px;}
    .toprow .rate .big{font-size:46px;}
    .toprow .minigrid{flex:0 0 auto;}
    .toprow .stat .v{font-size:20px;}
    .metrics{grid-area:metrics;}
    .metrics .hstat .v{font-size:16px;}
    .wrap > .btnrow{grid-area:btns;}
    .wrap > .btnrow button{min-height:42px; font-size:15px;}
    #log{grid-area:log; font-size:12px;}
    .chartrow{grid-area:charts; max-height:none; min-height:300px;}
    .chartrow h2{font-size:13px;}
    .hist{grid-area:hist;}
    .hist .hstat .v{font-size:15px;}
    .hist .hlist{max-height:56px; font-size:12px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>☢️ 剂量监测</h1>
    <div class="dev"><span class="dot" id="dot"></span><span id="devName">未连接</span></div>
  </header>

  <div class="toprow">
    <div class="card rate" id="rateCard">
      <div class="label">剂量率</div>
      <div class="big"><span id="rateVal">--</span><small id="rateUnit">µSv/h</small></div>
      <div class="note" id="rateNote"></div>
    </div>
    <div class="minigrid">
      <div class="stat"><div class="v" id="cpsVal">--</div><div class="k">计数率 CPS</div></div>
      <div class="stat"><div class="v" id="accVal">--</div><div class="k">累计 µSv</div></div>
      <div class="stat"><div class="v" id="thrVal">--</div><div class="k">阈值 µSv/h</div></div>
      <div class="alarmbar ok" id="alarmBox">状态未知</div>
    </div>
  </div>

  <div class="chartrow">
    <div class="card">
      <h2>计数率趋势 (CPS)</h2>
      <canvas id="chart"></canvas>
    </div>
    <div class="card">
      <h2>能谱 (30~1600 keV · 256道)</h2>
      <canvas id="spChart"></canvas>
    </div>
  </div>

  <div class="card metrics">
    <div class="hstats" style="grid-template-columns:repeat(3,1fr)">
      <div class="hstat"><div class="v" id="spTrig">--</div><div class="k">入射计数</div></div>
      <div class="hstat"><div class="v" id="spProc">--</div><div class="k">记录计数</div></div>
      <div class="hstat"><div class="v" id="spDead">--</div><div class="k">死区时间</div></div>
    </div>
  </div>

  <div class="card hist">
    <div class="hstats">
      <div class="hstat"><div class="v" id="hCount">0</div><div class="k">记录条数</div></div>
      <div class="hstat"><div class="v" id="hMax">--</div><div class="k">最大剂量率</div></div>
      <div class="hstat"><div class="v" id="hAvg">--</div><div class="k">平均剂量率</div></div>
      <div class="hstat"><div class="v" id="hAlarm">0</div><div class="k">报警次数</div></div>
    </div>
    <div id="hList" class="hlist"></div>
    <div class="btnrow" style="margin-top:4px;">
      <button id="btnExport">导出 CSV</button>
      <button id="btnClear" class="danger">清空历史</button>
    </div>
  </div>

  <div class="btnrow">
    <button id="btnConnect" class="primary">连接仪器</button>
    <button id="btnDisconnect" class="danger" disabled>断开</button>
    <button id="btnDemo">演示</button>
  </div>

  <div id="log"></div>
</div>

<script>
"use strict";
/* ===== 配置：换用非 NUS 模块时只改这里 ===== */
var NUS_SERVICE_UUID = "0000ffe0-0000-1000-8000-00805f9b34fb"; // VG6328A 服务 0xFFE0
var NUS_NOTIFY_UUID  = "0000ffe2-0000-1000-8000-00805f9b34fb"; // VG6328A 通知 0xFFE2 (UART -> APP)
var RATE_UNIT   = "µSv/h";
var CALIBRATED  = false;   // 剂量率未做标定：显示“仅供参考”提示
var NAME_PREFIX = "";      // 可选设备名前缀过滤，如 "DOSE"；留空 = 列出附近所有 BLE 设备
var HISTORY_N   = 180;
var HISTORY_KEY = "dose_history_v1";   // 历史记录存储键
var HISTORY_MAX = 2000;                // 最多保存条数
var HISTORY_INTERVAL_MS = 10000;       // 每 10 秒记录一条     // 趋势点数（每秒 1 点 = 3 分钟）

/* ===== 状态 ===== */
var device = null, notifyChar = null, rxBuf = "", rxText = "", connected = false, connecting = false;
var demo = false, demoTimer = null;
var hist = [];             // {t, cps}
var lastVib = 0;
var last = null;           // {cps, rate, acc, thr, alarm}

function $(id){ return document.getElementById(id); }
var el = {
  rate:$("rateVal"), cps:$("cpsVal"), acc:$("accVal"), thr:$("thrVal"),
  rateNote:$("rateNote"),
  alarm:$("alarmBox"), dot:$("dot"), dev:$("devName"), log:$("log"),
  chart:$("chart"), rateCard:$("rateCard"),
  hCount:$("hCount"), hMax:$("hMax"), hAvg:$("hAvg"), hAlarm:$("hAlarm"), hList:$("hList"),
  spChart:$("spChart"), spTrig:$("spTrig"), spProc:$("spProc"), spDead:$("spDead"),
  btnExport:$("btnExport"), btnClear:$("btnClear"),
  btnC:$("btnConnect"), btnD:$("btnDisconnect"), btnDemo:$("btnDemo")
};

function log(msg){ el.log.textContent = msg; }
function err(msg){ el.log.textContent = "⚠ " + msg; }
function buzz(){
  try{
    if(!navigator.vibrate) return;
    var now = Date.now();
    if(now - lastVib > 1500){ lastVib = now; navigator.vibrate([200,100,200]); }
  }catch(_){}
}

/* ===== 蓝牙连接 ===== */
el.btnC.addEventListener("click", async function(){
  if(connecting) return;
  if(!("bluetooth" in navigator)){
    log("此浏览器不支持 Web Bluetooth。\n请用安卓 Chrome/Edge，并通过 HTTPS（或 localhost）打开本页。");
    return;
  }
  connecting = true;
  el.btnC.disabled = true;
  log("正在搜索仪器…请在系统弹窗中选择设备");
  try{
    var opts = { optionalServices:[NUS_SERVICE_UUID] };
    if(NAME_PREFIX){ opts.filters = [{ namePrefix: NAME_PREFIX }]; }
    else { opts.acceptAllDevices = true; }
    var d = await navigator.bluetooth.requestDevice(opts);
    device = d;
    d.addEventListener("gattserverdisconnected", onLost);
    log("正在连接 " + (d.name || d.id) + " …");
    var server = await d.gatt.connect();
    var svc = await server.getPrimaryService(NUS_SERVICE_UUID);
    notifyChar = await svc.getCharacteristic(NUS_NOTIFY_UUID);
    await notifyChar.startNotifications();
    notifyChar.addEventListener("characteristicvaluechanged", onData);
    connected = true;
    hist = [];
    el.dev.textContent = d.name || "已连接";
    setDot("on");
    el.btnD.disabled = false;
    log("已连接：" + (d.name || d.id) + "，等待数据…\n若长时间无数据，请确认固件每秒发送一行 JSON。");
  }catch(e){
    connected = false;
    if(e && e.name === "NotFoundError"){
      log("未找到 0xFFE0 服务。\n请确认模块是 VG6328A（默认 BLE 名 XLBLE），或修改页面顶部 UUID 常量。");
    }else if(e && e.name === "SecurityError"){
      log("需要 HTTPS 或 localhost 环境才能使用蓝牙。");
    }else{
      log("连接失败或已取消：\n" + (e && e.message ? e.message : e));
    }
    setDot("err");
    el.dev.textContent = "未连接";
  }finally{
    connecting = false;
    el.btnC.disabled = demo || connected;
  }
});

function setDot(cls){ el.dot.className = "dot" + (cls ? " " + cls : ""); }

function onLost(){
  connected = false;
  el.dev.textContent = "连接已断开";
  setDot("err");
  el.btnD.disabled = true;
  el.btnC.disabled = demo;
  el.rateCard.className = "card rate";
  log("蓝牙已断开，可重新点击“连接仪器”。");
}

el.btnD.addEventListener("click", function(){
  if(device && device.gatt && device.gatt.connected){ device.gatt.disconnect(); }
  onLost();
});

/* ===== 数据接收：按 \n 重组整行再解析 ===== */
var decoder = new TextDecoder("utf-8");
function onData(ev){
  var v = ev.target.value;
  var bytes = new Uint8Array(v.buffer, v.byteOffset, v.byteLength);
  rxText += decoder.decode(bytes, {stream:true});
  var idx;
  while((idx = rxText.indexOf("\n")) >= 0){
    var line = rxText.slice(0, idx).trim();
    rxText = rxText.slice(idx + 1);
    if(!line) continue;
    var obj = null;
    try{ obj = JSON.parse(line); }catch(_){ continue; } // 坏行跳过
    if(obj && obj.t === "s" && obj.ch){ applySpec(obj); continue; }
    if(obj && obj.t === "m"){ applyMetrics(obj); continue; }
    if(obj && (typeof obj.cps === "number" || typeof obj.rate === "number")){ apply(obj); }
  }
}

function apply(o){
  var now = Date.now();
  if(typeof o.cps === "number"){
    hist.push({t:now, cps:o.cps});
    if(hist.length > HISTORY_N){ hist.shift(); }
  }
  var rate = (typeof o.rate === "number") ? o.rate : null;
  var alarm = (typeof o.alarm === "number") ? !!o.alarm
            : (rate !== null && typeof o.thr === "number" && rate >= o.thr);
  last = { cps:o.cps, rate:rate, acc:o.acc, thr:o.thr, alarm:alarm };
  render();
  maybeRecord();
}

/* ===== 渲染 ===== */
function fmt(v, digits){
  if(v === null || v === undefined || isNaN(v)) return "--";
  return Number(v).toFixed(digits);
}
function render(){
  if(!last) return;
  el.cps.textContent = fmt(last.cps, 0);
  el.rate.textContent = fmt(last.rate, last.rate !== null && last.rate < 1 ? 3 : 2);
  el.acc.textContent = fmt(last.acc, 2);
  el.thr.textContent = fmt(last.thr, 2);
  el.rateNote.textContent = CALIBRATED ? "" : "（数值未标定，仅供参考）";
  var alarming = !!last.alarm;
  if(alarming){
    document.body.classList.add("alarm");
    el.alarm.className = "alarmbar bad";
    el.alarm.textContent = "⚠ 超阈值报警";
    el.rateCard.className = "card rate alarm";
    buzz();
  }else{
    document.body.classList.remove("alarm");
    el.alarm.className = "alarmbar ok";
    el.alarm.textContent = "正常";
    el.rateCard.className = "card rate ok";
  }
  drawChart();
}

/* ===== 趋势图（canvas 自绘，无依赖） ===== */
function drawChart(){
  try{
    var cv = el.chart;
    if(!cv){ err("图表节点不存在"); return; }
    var ctx = cv.getContext("2d");
    if(!ctx){ err("当前浏览器不支持 Canvas 绘图"); return; }
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth || (cv.parentNode ? cv.parentNode.clientWidth : 0) || 300;
    var h = cv.clientHeight || 170;
    if(w < 4 || h < 4){ w = 300; h = 170; }
    if(cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)){
      cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    }
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);

    var padL = 32, padR = 4, padT = 5, padB = 6;
    var plotW = w - padL - padR, plotH = h - padT - padB;
    function axisY(v){ return padT + (1 - v) * plotH; } // v: 0=底,1=顶

    ctx.font = "9px sans-serif";
    ctx.strokeStyle = "rgba(139,152,165,0.18)"; ctx.lineWidth = 1;

    if(!hist.length){
      for(var gi=0; gi<=4; gi++){
        var yy0 = padT + (gi/4)*plotH;
        ctx.beginPath(); ctx.moveTo(padL, yy0); ctx.lineTo(w-padR, yy0); ctx.stroke();
      }
      ctx.fillStyle = "#8b98a5"; ctx.textAlign = "center";
      ctx.fillText("等待数据…", padL + plotW/2, h/2);
      ctx.textAlign = "left";
      return;
    }

    var max = 10, i;
    for(i=0;i<hist.length;i++){ if(hist[i].cps > max) max = hist[i].cps; }
    max = Math.ceil(max * 1.1);

    // 横网格线 + 纵坐标刻度
    ctx.textAlign = "right"; ctx.fillStyle = "#8b98a5";
    for(var k=0; k<=4; k++){
      var val = max * (1 - k/4);
      var yy = padT + (k/4)*plotH;
      ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(w-padR, yy); ctx.stroke();
      ctx.fillText(Math.round(val) + "", padL - 5, yy + 3);
    }
    ctx.textAlign = "left";

    // 曲线 + 末点
    ctx.strokeStyle = "#58a6ff"; ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.beginPath();
    for(i=0;i<hist.length;i++){
      var x = padL + (i/(HISTORY_N-1)) * plotW;
      var y = axisY(hist[i].cps / max);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
    var lx = padL + ((hist.length-1)/(HISTORY_N-1)) * plotW;
    var ly = axisY(hist[hist.length-1].cps / max);
    ctx.fillStyle = "#58a6ff";
    ctx.beginPath(); ctx.arc(lx, ly, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#8b98a5";
    ctx.textAlign = "right";
    ctx.fillText("点数 " + hist.length, w - padR, 12);
    ctx.textAlign = "left";
  }catch(e){
    err("图表绘制错误: " + (e && e.message ? e.message : e));
  }
}

window.addEventListener("resize", drawChart);

/* ===== 演示模式：无硬件时预览界面 ===== */
el.btnDemo.addEventListener("click", function(){
  if(demo){ stopDemo(); return; }
  if(connected && device && device.gatt && device.gatt.connected){ device.gatt.disconnect(); onLost(); }
  demo = true;
  el.btnDemo.textContent = "停止演示";
  el.btnC.disabled = true; el.btnD.disabled = true;
  el.dev.textContent = "演示数据";
  setDot("demo");
  hist = [];
  var cps = 120, acc = 0, thr = 0.5;
  var demoTick = 0;
  var demoHist = new Array(SPEC_N).fill(0);   /* 演示用累积谱 */
  var demoTrig = 0, demoProc = 0, demoBusy = 0, demoTotal = 0;
  demoTimer = setInterval(function(){
    try{
      cps = Math.max(5, Math.round(cps + (Math.random()-0.5)*40 + (Math.random()<0.02 ? 150 : 0)));
      var rate = cps * 0.0018 + Math.random()*0.02; // 模拟未标定换算
      acc += rate / 3600;
      apply({ cps:cps, rate:rate, acc:acc, thr:thr, alarm:rate >= thr });

      /* 每 5 秒模拟一帧能谱 + 死时间指标（241Am 59.5keV / 137Cs 662keV） */
      demoTick++;
      if(demoTick % 5 === 0){
        var chAm = Math.round((59.5 - SPEC_EMIN)/(SPEC_EMAX - SPEC_EMIN)*(SPEC_N-1));
        var chCs = Math.round((662  - SPEC_EMIN)/(SPEC_EMAX - SPEC_EMIN)*(SPEC_N-1));
        for(var i=0;i<SPEC_N;i++){
          var v = 1.5 + 5*Math.exp(-i/70)
                + 26*Math.exp(-0.5*Math.pow((i-45)/22,2))          /* 康普顿平台 */
                + 300*Math.exp(-0.5*Math.pow((i-chAm)/2.4,2))       /* 241Am 59.5keV */
                + 900*Math.exp(-0.5*Math.pow((i-chCs)/3.6,2));      /* 137Cs 662keV */
          demoHist[i] += Math.max(0, Math.round(v/6 + (Math.random()-0.5)*2));
        }
        for(var k=0;k<8;k++){ applySpec({ t:"s", n:SPEC_N, i:k, ch:demoHist.slice(k*32,(k+1)*32) }); }
        demoTrig += 4500;                    /* ≈900 cps × 5s */
        demoProc += 4442;                    /* ≈888 cps → 死时间≈1.3% */
        demoTotal += 5000;
        demoBusy += Math.round(demoTotal*1000*(1 - demoProc/demoTrig));
        applyMetrics({ t:"m", trig:demoTrig, proc:demoProc, bin:demoProc, oor:0,
                       pile:demoTrig-demoProc, busy_us:demoBusy, total_ms:demoTotal });
      }
    }catch(e){
      err("演示运行错误: " + (e && e.message ? e.message : e));
    }
  }, 1000);
  log("演示模式：正在模拟每秒一条数据。");
});

function stopDemo(){
  demo = false;
  clearInterval(demoTimer);
  el.btnDemo.textContent = "演示模式";
  el.btnC.disabled = false;
  el.dev.textContent = "未连接";
  setDot("");
  log("演示已停止。");
}
/* ===== 能谱 + 实测死时间（数据全部来自仪器上报，不做估算） ===== */
var SPEC_N = 256;
var SPEC_EMIN = 30;      /* keV，区间下限 */
var SPEC_EMAX = 1600;    /* keV，区间上限 */
var SPEC_KEV_PER_CH = (SPEC_EMAX - SPEC_EMIN) / SPEC_N;   /* ≈6.13 keV/道 */
function chToKeV(ch){ return SPEC_EMIN + (SPEC_EMAX - SPEC_EMIN) * ch / (SPEC_N - 1); }
var spec = new Array(SPEC_N).fill(0);
var specRecv = 0;            /* 已收到的道数（用于判断是否完整一帧） */

function applySpec(o){
  try{
    var chunk = o.ch || [];
    var idx = (typeof o.i === "number" ? o.i : 0) * chunk.length;
    for(var i=0;i<chunk.length && (idx+i)<SPEC_N;i++){ spec[idx+i] = Number(chunk[i]) || 0; }
    specRecv = Math.min(SPEC_N, Math.max(specRecv, idx + chunk.length));
    drawSpec();
  }catch(e){ err("能谱解析错误: " + e.message); }
}

function applyMetrics(o){
  try{
    var trig = Number(o.trig)||0, proc = Number(o.proc)||0;
    var Dcnt = trig>0 ? (1 - proc/trig) : null;   /* 死区时间 = 1 - 记录/入射（实测） */
    el.spTrig.textContent = trig;
    el.spProc.textContent = proc;
    el.spDead.textContent = (Dcnt===null) ? "--" : (Dcnt*100).toFixed(2) + "%";
  }catch(e){ err("死区时间解析错误: " + e.message); }
}

function drawSpec(){
  try{
    var cv = el.spChart;
    if(!cv) return;
    var ctx = cv.getContext("2d");
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth || 320, h = cv.clientHeight || 240;
    if(cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)){ cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    var padL = 30, padR = 4, padT = 6, padB = 18;
    var plotW = w - padL - padR, plotH = h - padT - padB;
    var maxV = 1, i;
    for(i=0;i<SPEC_N;i++){ if(spec[i] > maxV) maxV = spec[i]; }
    var logMax = Math.ceil(Math.log10(maxV)); if(logMax < 3) logMax = 3;

    /* 网格 + 对数刻度（自适应步长：网格线保持在 4~6 条） */
    ctx.font = "9px sans-serif";
    var gridStep = Math.max(1, Math.ceil(logMax / 4));
    var kk;
    for(kk=0; kk<=logMax; kk+=gridStep){
      var y = padT + plotH*(1 - kk/logMax);
      ctx.strokeStyle = "rgba(139,152,165,0.18)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
      ctx.fillStyle = "#8b98a5"; ctx.textAlign = "right";
      ctx.fillText("1e"+kk, padL-5, y+3);
    }
    if(logMax % gridStep !== 0){    /* 顶部量级补齐 */
      ctx.strokeStyle = "rgba(139,152,165,0.18)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL,padT); ctx.lineTo(w-padR,padT); ctx.stroke();
      ctx.fillStyle = "#8b98a5"; ctx.textAlign = "right";
      ctx.fillText("1e"+logMax, padL-5, padT+3);
    }
    if(specRecv === 0){
      ctx.fillStyle = "#8b98a5"; ctx.textAlign = "center";
      ctx.fillText("等待能谱数据…（连接仪器或点演示模式）", padL + plotW/2, h/2);
      return;
    }
    /* 谱线 */
    ctx.beginPath();
    for(i=0;i<SPEC_N;i++){
      var x = padL + (i/(SPEC_N-1))*plotW;
      var v = spec[i] > 0 ? Math.log10(spec[i]) : 0;
      var yy = padT + plotH*(1 - v/logMax);
      if(i===0) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
    }
    ctx.strokeStyle = "#58a6ff"; ctx.lineWidth = 2; ctx.stroke();
    ctx.lineTo(w-padR, padT+plotH); ctx.lineTo(padL, padT+plotH); ctx.closePath();
    ctx.fillStyle = "rgba(88,166,255,0.15)"; ctx.fill();
    /* 横轴：能量 (keV) */
    ctx.textAlign = "center"; ctx.fillStyle = "#8b98a5";
    var ticks = (plotW > 300) ? [200,400,600,800,1000,1200,1400,1600] : [400,800,1200,1600];
    for(i=0;i<ticks.length;i++){
      var ke = ticks[i];
      if(ke < SPEC_EMIN || ke > SPEC_EMAX) continue;
      var xx = padL + ((ke - SPEC_EMIN)/(SPEC_EMAX - SPEC_EMIN))*plotW;
      ctx.strokeStyle = "rgba(139,152,165,0.10)";
      ctx.beginPath(); ctx.moveTo(xx,padT); ctx.lineTo(xx,padT+plotH); ctx.stroke();
      ctx.fillText(ke + "", xx, h-8);
    }
    /* 最强道标记（换算成 keV） */
    var mx = 0; for(i=1;i<SPEC_N;i++){ if(spec[i] > spec[mx]) mx = i; }
    if(spec[mx] > 1){
      var xm = padL + (mx/(SPEC_N-1))*plotW;
      ctx.strokeStyle = "#f0883e"; ctx.setLineDash([5,4]); ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(xm,padT); ctx.lineTo(xm,padT+plotH); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#f0883e"; ctx.textAlign = "left";
      ctx.fillText("峰≈" + Math.round(chToKeV(mx)) + " keV", Math.min(xm+4, w-92), padT+12);
    }
  }catch(e){ err("能谱绘制错误: " + e.message); }
}
window.addEventListener("resize", drawSpec);

/* ===== 历史记录（localStorage 本地保存） ===== */
var historyData = [];
function loadHistory(){
  try{
    var s = localStorage.getItem(HISTORY_KEY);
    historyData = s ? JSON.parse(s) : [];
    if(!Array.isArray(historyData)) historyData = [];
  }catch(_){ historyData = []; }
}
function saveHistory(){
  try{
    localStorage.setItem(HISTORY_KEY, JSON.stringify(historyData));
  }catch(e){
    try{
      historyData = historyData.slice(-Math.floor(HISTORY_MAX/2));
      localStorage.setItem(HISTORY_KEY, JSON.stringify(historyData));
    }catch(_){}
  }
}
function maybeRecord(){
  if(!last) return;
  var now = Date.now();
  if(historyData.length && (now - historyData[historyData.length-1].t) < HISTORY_INTERVAL_MS) return;
  historyData.push({ t:now, rate:last.rate, cps:last.cps, acc:last.acc, thr:last.thr, al:last.alarm?1:0 });
  if(historyData.length > HISTORY_MAX) historyData = historyData.slice(-HISTORY_MAX);
  saveHistory();
  renderHistory();
}
function fmtTime(ms){
  var d = new Date(ms);
  function p(n){ return (n<10?"0":"")+n; }
  return (d.getMonth()+1)+"/"+d.getDate()+" "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
}
function renderHistory(){
  if(!el.hList) return;
  var n = historyData.length;
  el.hCount.textContent = n;
  var maxV = 0, sum = 0, cnt = 0, al = 0, i;
  for(i=0;i<n;i++){
    var r = historyData[i];
    if(typeof r.rate === "number"){ if(r.rate > maxV) maxV = r.rate; sum += r.rate; cnt++; }
    if(r.al) al++;
  }
  el.hMax.textContent   = cnt ? maxV.toFixed(3) : "--";
  el.hAvg.textContent   = cnt ? (sum/cnt).toFixed(3) : "--";
  el.hAlarm.textContent = al;
  var rows = "";
  for(i=n-1; i>=0 && i>=n-3; i--){
    var r2 = historyData[i];
    rows += '<div class="hrow'+(r2.al?' al':'')+'"><span>'+fmtTime(r2.t)+'</span>'
          + '<span>'+(r2.rate!=null?Number(r2.rate).toFixed(3):"--")+' µSv/h</span>'
          + '<span>'+(r2.cps!=null?r2.cps:"--")+' CPS</span></div>';
  }
  el.hList.innerHTML = rows || '<div class="hrow" style="color:#8b98a5">暂无记录（连接仪器或演示模式后，每 10 秒自动记录一条）</div>';
}
function clearHistory(){
  if(!confirm("确定清空全部历史记录吗？")) return;
  historyData = [];
  saveHistory();
  renderHistory();
  log("历史记录已清空。");
}
function exportCSV(){
  if(!historyData.length){ log("暂无历史记录可导出。"); return; }
  var out = "时间,剂量率(uSv/h),计数率(CPS),累计剂量(uSv),报警\n";
  for(var i=0;i<historyData.length;i++){
    var r = historyData[i];
    out += [new Date(r.t).toLocaleString(), (r.rate!=null?r.rate:""), (r.cps!=null?r.cps:""), (r.acc!=null?r.acc:""), (r.al?1:0)].join(",") + "\n";
  }
  var blob = new Blob(["\ufeff"+out], {type:"text/csv;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "剂量历史_" + new Date().toISOString().slice(0,10) + ".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  log("已导出 CSV（" + historyData.length + " 条）。");
}
el.btnExport.addEventListener("click", exportCSV);
el.btnClear.addEventListener("click", clearHistory);

drawChart();
loadHistory();
renderHistory();
drawSpec();
</script>
